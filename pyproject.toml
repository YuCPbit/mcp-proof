[project]
name = "mcp-proof"
version = "0.2.0"
description = "Ship an MCP server with a receipt: deterministic conformance, security and regression audit that outputs a client-ready delivery report."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "mcp>=1.29",
    "jinja2>=3.1",
    "jsonschema>=4.0",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
    "fastmcp>=3.0",
]

[project.scripts]
mcp-proof = "mcpproof.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
mcpproof = ["report/template.html"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
